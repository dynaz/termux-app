# Google Play purchases are verified by the Cloud Functions in firebase/. Set the region they
# are deployed to, like asia-southeast1. Empty: the app says that purchases are not set up.
functionsRegion=asia-southeast1

# The Google Cloud project number of linex-bf945, for Play Integrity tokens that the backend
# observes. 0: the app asks for none.
integrityCloudProjectNumber=1083578001086
