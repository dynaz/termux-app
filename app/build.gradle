plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

// The bootstrap archives for the app package name, built by scripts/terminow/build-bootstrap.sh.
// The bootstraps of termux-packages releases can not be used since they are compiled for com.termux.
def terminowBootstrap = new Properties()
file("terminow-bootstrap.properties").withInputStream { terminowBootstrap.load(it) }
def terminowBootstrapArchs = (terminowBootstrap.getProperty("architectures") ?: "").split(",").collect { it.trim() }.findAll { it }
def terminowAbiForArch = ["aarch64": "arm64-v8a", "arm": "armeabi-v7a", "i686": "x86", "x86_64": "x86_64"]
def terminowAbis = terminowBootstrapArchs.collect {
    if (!terminowAbiForArch.containsKey(it)) throw new GradleException("Unsupported architecture \"" + it + "\" in terminow-bootstrap.properties")
    terminowAbiForArch[it]
}
if (terminowAbis.isEmpty()) throw new GradleException("No architectures are set in terminow-bootstrap.properties")

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "androidx.recyclerview:recyclerview:1.3.2"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
        // Sign in with Google, through the Credential Manager of Android
        implementation "androidx.credentials:credentials:1.3.0"
        implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
        implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
        // SFTP for the File Explorer, with known_hosts checking (maintained fork of JSch)
        implementation "com.github.mwiede:jsch:0.2.20"
        // FIDO2 security keys over USB and NFC (CTAP2), for the FIDO2 keys of the keychain
        implementation "com.yubico.yubikit:android:3.1.0"
        implementation "com.yubico.yubikit:fido:3.1.0"
        // Argon2 for the passphrases of PuTTY v3 keys
        implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        // The applicationId must equal TermuxConstants.TERMUX_PACKAGE_NAME and the
        // TERMUX_APP__PACKAGE_NAME that the bootstrap packages are compiled for. The namespace
        // above is the Java package of the app classes and is not changed with it.
        applicationId "com.terminow"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 214
        versionName "1.120.0.214"

        if (appVersionName) versionName = appVersionName
        // Optional CI override so a release build can use a versionCode above the
        // live Play release without editing this file (e.g. for Internal testing).
        def appVersionCode = System.getenv("TERMUX_APP_VERSION_CODE") ?: ""
        if (appVersionCode) versionCode = appVersionCode.toInteger()
        validateVersionName(versionName)

        // Shown in the about section of the settings, to tell which build is installed
        def terminowBootstrapUrl = terminowBootstrap.getProperty("url." + terminowBootstrapArchs[0]) ?: ""
        def terminowBootstrapRelease = terminowBootstrapUrl.replaceAll(".*/download/([^/]+)/.*", '$1')
        def terminowCommit = ""
        try {
            terminowCommit = ["git", "-C", rootDir.path, "rev-parse", "--short=8", "HEAD"].execute().text.trim()
        } catch (Exception ignored) {
        }
        buildConfigField "String", "TERMINOW_BOOTSTRAP_RELEASE", "\"" + terminowBootstrapRelease + "\""
        buildConfigField "String", "TERMINOW_COMMIT", "\"" + terminowCommit + "\""

        // The Firebase project of TermiNow accounts, from app/google-services.json, which is not
        // committed. Without it the build works, and accounts are shown as not set up.
        def firebaseApiKey = ""
        def firebaseProjectId = ""
        def googleWebClientId = ""
        def googleServicesFile = file("google-services.json")
        if (googleServicesFile.isFile()) {
            def googleServices = new groovy.json.JsonSlurper().parse(googleServicesFile)
            def firebaseClient = googleServices.client.find { it.client_info.android_client_info.package_name == "com.terminow" }
            if (firebaseClient != null) {
                firebaseApiKey = firebaseClient.api_key[0].current_key
                firebaseProjectId = googleServices.project_info.project_id
                // Google sign-in asks for an ID token for the web client of the project
                def webClient = (firebaseClient.oauth_client ?: []).find { it.client_type == 3 }
                if (webClient != null) googleWebClientId = webClient.client_id
            }
        }
        buildConfigField "String", "TERMINOW_FIREBASE_API_KEY", "\"" + firebaseApiKey + "\""
        buildConfigField "String", "TERMINOW_FIREBASE_PROJECT_ID", "\"" + firebaseProjectId + "\""
        buildConfigField "String", "TERMINOW_GOOGLE_WEB_CLIENT_ID", "\"" + googleWebClientId + "\""
        // The region of the Cloud Functions that verify Google Play purchases, see firebase/README.md
        def billingProperties = new Properties()
        def billingFile = file("terminow-billing.properties")
        if (billingFile.isFile()) billingFile.withInputStream { billingProperties.load(it) }
        def functionsRegion = billingProperties.getProperty("functionsRegion", "").trim()
        if (!functionsRegion.isEmpty() && !(functionsRegion ==~ /[a-z]+-[a-z]+[0-9]/))
            throw new GradleException("functionsRegion in app/terminow-billing.properties is not a region: " + functionsRegion)
        buildConfigField "String", "TERMINOW_FUNCTIONS_REGION", "\"" + functionsRegion + "\""
        // The Google Cloud project number for Play Integrity tokens, 0 to not ask for one
        def integrityProjectNumber = billingProperties.getProperty("integrityCloudProjectNumber", "0").trim()
        if (!(integrityProjectNumber ==~ /[0-9]+/))
            throw new GradleException("integrityCloudProjectNumber in app/terminow-billing.properties is not a number: " + integrityProjectNumber)
        buildConfigField "long", "TERMINOW_INTEGRITY_PROJECT_NUMBER", integrityProjectNumber + "L"
        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.terminow"
        manifestPlaceholders.TERMUX_APP_NAME = "TermiNow"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
                // The bootstrap is only built for the architectures in terminow-bootstrap.properties
                abiFilters(*terminowAbis)
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include(*terminowAbis)
                universalApk false
            }
        }
    }

    signingConfigs {
        // The upload key for Google Play, only set if its keystore is given in the environment
        if (System.getenv("TERMINOW_UPLOAD_KEYSTORE_FILE")) {
            release {
                storeFile file(System.getenv("TERMINOW_UPLOAD_KEYSTORE_FILE"))
                storePassword System.getenv("TERMINOW_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TERMINOW_UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("TERMINOW_UPLOAD_KEYSTORE_PASSWORD")
            }
        }
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName("release")
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // The built-in RDP engine, libterminow-rdp.so, made by native/rdp/build.sh with the pinned
    // OpenSSL and FreeRDP. Without it, RDP hosts say that this build has no RDP.
    sourceSets.main.jniLibs.srcDirs += 'src/main/rdpLibs'

    packagingOptions {
        jniLibs {
            // Native libraries must be extracted when the app is installed, since the proot loader
            // is executed from the native library directory
            useLegacyPackaging true
            // The proot loader is a static executable that is already stripped
            keepDebugSymbols += "**/libproot-loader.so"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + variant.flavorName + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + variant.flavorName + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    // Two distributions, so that the Google Play build never declares All files access:
    // "play" reaches shared storage only through folders that the user picks with the Storage
    // Access Framework, "full" adds browsing shared storage by path for direct APK installs.
    flavorDimensions += "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "boolean", "TERMINOW_ALL_FILES_ACCESS", "true"
        }
        full {
            dimension "distribution"
            buildConfigField "boolean", "TERMINOW_ALL_FILES_ACCESS", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Google Play Billing for Premium, in the Play build only
    playImplementation "com.android.billingclient:billing:8.3.0"
    // Play Integrity, observed by the backend only, see firebase/README.md
    playImplementation "com.google.android.play:integrity:1.4.0"

    testImplementation "junit:junit:4.13.2"
    // The real org.json for unit tests, android.jar only has stubs
    testImplementation "org.json:json:20231013"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // Also a fourth number, like 0.119.0.1, for TermiNow's own builds
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:\\.(0|[1-9]\\d*))?(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(.build)(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String remoteUrl) {
    downloadVerifiedFile("src/main/cpp/bootstrap-" + arch + ".zip", expectedChecksum, remoteUrl)
}

def downloadVerifiedFile(String localUrl, String expectedChecksum, String remoteUrl) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
        def loaders = fileTree(new File(projectDir, 'src/main/jniLibs'))
        loaders.include '**/libproot-loader.so'
        loaders.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant != "apt-android-7")
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")

        terminowBootstrapArchs.each { arch ->
            def localFile = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")
            def url = terminowBootstrap.getProperty("url." + arch) ?: ""
            def checksum = terminowBootstrap.getProperty("sha256." + arch) ?: ""
            if (System.getenv("TERMINOW_USE_LOCAL_BOOTSTRAP") == "1") {
                // For testing a bootstrap that has not been released yet
                if (!localFile.exists())
                    throw new GradleException("TERMINOW_USE_LOCAL_BOOTSTRAP is set but \"" + localFile + "\" does not exist")
                logger.quiet("Using local bootstrap without verifying it: " + localFile)
            } else if (url.isEmpty() || checksum.isEmpty()) {
                throw new GradleException("The " + arch + " bootstrap for " + android.defaultConfig.applicationId +
                    " is not set in app/terminow-bootstrap.properties. Build it with scripts/terminow/build-bootstrap.sh" +
                    " or the terminow_bootstrap workflow, which sets it.")
            } else {
                downloadBootstrap(arch, checksum, url)
            }

            // The proot loader is included as a native library, since the files that the proot
            // package installs in the app data directory can not be executed. It is named like a
            // library so that it is put in the APK and extracted to the native library directory.
            def loaderUrl = "src/main/jniLibs/" + terminowAbiForArch[arch] + "/libproot-loader.so"
            def loaderRemoteUrl = terminowBootstrap.getProperty("proot-loader.url." + arch) ?: ""
            def loaderChecksum = terminowBootstrap.getProperty("proot-loader.sha256." + arch) ?: ""
            if (System.getenv("TERMINOW_USE_LOCAL_BOOTSTRAP") == "1") {
                logger.quiet((new File(projectDir, loaderUrl).exists() ? "Using" : "No") + " local proot loader: " + loaderUrl)
            } else if (loaderRemoteUrl.isEmpty() || loaderChecksum.isEmpty()) {
                new File(projectDir, loaderUrl).delete()
                logger.quiet("The " + arch + " proot loader is not set in app/terminow-bootstrap.properties," +
                    " proot and proot-distro will not work in this build.")
            } else {
                downloadVerifiedFile(loaderUrl, loaderChecksum, loaderRemoteUrl)
            }
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
        // The proot loader must be downloaded before the native libraries are collected
        tasks.named("merge" + variant.name.capitalize() + "JniLibFolders").configure { dependsOn(downloadBootstraps) }
    }
}
