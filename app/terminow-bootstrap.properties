# The bootstrap archives included in the app, built for the com.terminow package name by
# scripts/terminow/build-bootstrap.sh. The url and sha256 of each architecture are set by the
# terminow_bootstrap workflow when it releases a new bootstrap.
#
# aarch64 is the fully-shipped production ABI. x86_64 is EXPERIMENTAL: its bootstrap, proot loader
# and native libraries build and package, but it is not advertised or enabled for a production
# release until it is validated on an x86_64 Android emulator/device (see the x86_64 emulator
# smoke-test workflow). Keeping it here makes the build produce the x86_64 ABI so it can be tested.
architectures=aarch64,x86_64
url.aarch64=https://github.com/dynaz/terminow-package/releases/download/terminow-bootstrap-2026.10.25-r2/bootstrap-aarch64.zip
sha256.aarch64=6152121dc08da9cf1a797842d190524a7cc827a5bcd30fef52044818e5987b63
url.x86_64=https://github.com/dynaz/terminow-package/releases/download/terminow-bootstrap-2026.10.31-r9/bootstrap-x86_64.zip
sha256.x86_64=122467f5f4b449acc27841749b99d7a5f66bd518da30608592a609248f27ac01

# The proot loader of the same build as the bootstrap, included in the app as the
# libproot-loader.so native library since it can not be executed from the app data directory.
# Empty until a bootstrap that builds the proot package is released, proot does not work then.
proot-loader.url.aarch64=https://github.com/dynaz/terminow-package/releases/download/terminow-bootstrap-2026.10.25-r2/proot-loader-aarch64
proot-loader.sha256.aarch64=cbdef0e652c2b78af25d867e1719fdebbb0915e25aae2dd35b3b5c1835f6b551
proot-loader.url.x86_64=https://github.com/dynaz/terminow-package/releases/download/terminow-bootstrap-2026.10.31-r9/proot-loader-x86_64
proot-loader.sha256.x86_64=a836b0569c84b1661333d16bacf6b396ff08fea816a5c936a82e08ddeeca8341
