name: Build TermiNow AI APK (terminow)

# Builds a DEBUG APK of the terminow branch on an x86_64 runner, where the
# Android NDK host tools work (an aarch64 host cannot build the native code:
# ndk-build reports "Unknown host CPU architecture: aarch64"). ARM64 device
# support is preserved: the output is the arm64-v8a APK. Debug-signed, since
# release signing secrets are not configured here; it is clearly labelled.
on:
  workflow_dispatch:
  push:
    branches:
      - terminow

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"

          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-debug"

          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed for '$APK_VERSION_TAG'."
          fi

          # The app has product flavors (play, full), so APKs land under
          # app/build/outputs/apk/<flavor>/debug/ as *_<flavor>_arm64-v8a.apk.
          FOUND="$(find ./app/build/outputs/apk -name '*_arm64-v8a.apk' 2>/dev/null)"
          [ -n "$FOUND" ] || exit_on_error "arm64-v8a APK not found. Built: $(find ./app/build/outputs/apk -name '*.apk' 2>/dev/null)"
          echo "Built arm64-v8a APKs:"; echo "$FOUND"

      - name: Print signing certificate (SHA-256)
        run: |
          APKSIGNER="$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          for f in $(find ./app/build/outputs/apk -name '*_arm64-v8a.apk'); do
            echo "=== $f ==="
            "$APKSIGNER" verify --print-certs "$f" | grep -i "SHA-256 digest" || true
          done

      - name: Upload arm64-v8a debug APKs (play + full)
        uses: actions/upload-artifact@v6
        with:
          name: terminow-ai-debug-arm64-v8a
          path: |
            ./app/build/outputs/apk/*/debug/*_arm64-v8a.apk
            ./app/build/outputs/apk/*/debug/output-metadata.json
